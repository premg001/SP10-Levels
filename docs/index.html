<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nifty Levels</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: Arial, sans-serif;
      }
      body {
        margin: 0;
        padding: 24px;
        background: #0f172a;
        color: #e2e8f0;
      }
      .container {
        max-width: 1200px;
        margin: 0 auto;
      }
      h1 {
        margin-bottom: 8px;
      }
      .meta {
        color: #94a3b8;
        margin-bottom: 20px;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        background: rgba(15, 23, 42, 0.7);
      }
      th, td {
        padding: 10px 12px;
        border: 1px solid #334155;
        text-align: left;
      }
      th {
        background: #1e293b;
      }
      tr:nth-child(even) {
        background: rgba(148, 163, 184, 0.05);
      }
      .status {
        font-weight: 700;
      }
      .muted {
        color: #94a3b8;
      }
      .refresh-widget {
        position: fixed;
        top: 16px;
        right: 16px;
        z-index: 10;
        display: grid;
        gap: 4px;
        min-width: 190px;
        padding: 12px 14px;
        border: 1px solid #334155;
        border-radius: 10px;
        background: #1e293b;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25);
      }
      .refresh-title,
      .refresh-note {
        color: #94a3b8;
        font-size: 12px;
      }
      .refresh-time {
        font-size: 16px;
      }
      .refresh-countdown {
        color: #86efac;
        font-variant-numeric: tabular-nums;
      }
      @media (max-width: 520px) {
        .refresh-widget {
          position: static;
          margin: 0 0 20px auto;
          width: fit-content;
        }
      }
    </style>
  </head>
  <body>
    <aside class="refresh-widget" aria-label="Next scheduled data refresh">
      <span class="refresh-title">Next scheduled refresh</span>
      <strong id="next-refresh-time" class="refresh-time">Calculating…</strong>
      <span id="refresh-countdown" class="refresh-countdown"></span>
      <span class="refresh-note">Every 15 min · GitHub may delay runs</span>
    </aside>
    <div class="container">
      <h1>Nifty 50 Levels</h1>
      <div id="meta" class="meta">Loading…</div>
      <table>
        <thead>
          <tr>
            <th>#</th>
            <th>Name</th>
            <th>Price</th>
            <th>Weekly Buy</th>
            <th>Weekly Sell</th>
            <th>Daily Buy</th>
            <th>Daily Sell</th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
    </div>

    <script>
      function updateRefreshCountdown() {
        const now = Date.now();
        const intervalMs = 15 * 60 * 1000;
        const nextRefresh = new Date((Math.floor(now / intervalMs) + 1) * intervalMs);
        const secondsRemaining = Math.ceil((nextRefresh.getTime() - now) / 1000);
        const hours = Math.floor(secondsRemaining / 3600);
        const minutes = Math.floor((secondsRemaining % 3600) / 60);
        const seconds = secondsRemaining % 60;
        const time = new Intl.DateTimeFormat('en-IN', {
          timeZone: 'Asia/Kolkata',
          hour: '2-digit',
          minute: '2-digit',
          hourCycle: 'h23',
        }).format(nextRefresh);

        document.getElementById('next-refresh-time').textContent = `${time} IST`;
        document.getElementById('refresh-countdown').textContent =
          `In ${String(hours).padStart(2, '0')}:${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
      }

      updateRefreshCountdown();
      setInterval(updateRefreshCountdown, 1000);

      async function loadData() {
        try {
          const res = await fetch('./data.json');
          if (!res.ok) throw new Error('Unable to load data.json');
          const payload = await res.json();
          const rows = payload.rows || [];
          document.getElementById('meta').textContent = `Updated: ${payload.updated || 'n/a'}`;
          const tbody = document.getElementById('rows');
          tbody.innerHTML = rows.map((row) => `
            <tr>
              <td>${row.sno ?? ''}</td>
              <td>${row.name ?? ''}</td>
              <td>${row.cmp ?? '—'}</td>
              <td>${row.weekly_buy ?? '—'}</td>
              <td>${row.weekly_sell ?? '—'}</td>
              <td>${row.daily_buy ?? '—'}</td>
              <td>${row.daily_sell ?? '—'}</td>
            </tr>
          `).join('');
        } catch (error) {
          document.getElementById('meta').textContent = 'Unable to load level data.';
          document.getElementById('rows').innerHTML = `<tr><td colspan="7">${error.message}</td></tr>`;
        }
      }
      loadData();
    </script>
  </body>
</html>
